              file: projects/presentation/fruit-gdp.qmd
            - text: "Visualization Redesign"
              file: projects/presentation/visualization-redesign.qmd
        - section: "Exploratory Analysis"
          contents:
            - text: "Gun Deaths Analysis"
              file: projects/exploratory/gun-deaths.qmd
            - text: "Gun Deaths: Seasonal Patterns"
              file: projects/presentation/gun-deaths-seasonal.qmd
            - text: "Flight Delays by Origin"
              file: projects/exploratory/flight-delays.qmd
            - text: "Aircraft Age and Flight Delays"
              file: projects/flights/aircraft-age-delays.qmd
            - text: "Utah Baseball Programs"
              file: projects/flights/utah-baseball.qmd
        - section: "Data Wrangling"
          contents:
