website:
  title: "Owen Morales"
  favicon: Images/favicon.png
  back-to-top-navigation: true
  repo-url: https://github.com/omora14/analysis-portfolio
  page-footer:
    border: true
    left: "Owen Morales © 2026"
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/moralow
      - icon: github
        href: https://github.com/omora14
      - icon: envelope
        href: mailto:morales.owen@icloud.com

  navbar:
    background: primary
    search: true
    right:
      - text: "Home"
        file: index.qmd
      - text: "Resume"
        href: resume.pdf
      - text: "Projects"
        file: projects.qmd

